<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RozeLynx Extension Converter</title>
<link rel="icon" href="../../icons/icon32.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  padding: 24px;
  min-height: 100vh;
  background: #fff;
  color: #333;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
h2 { margin-bottom: 12px; color: #111; }
p { margin-bottom: 8px; max-width: 480px; line-height: 1.5; }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid #e5e7eb; border-top-color: #8B5CF6;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 16px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
button {
  margin-top: 16px;
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  background: #8B5CF6;
  color: white;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
button:hover { background: #7C3AED; }
#status { color: #6b7280; font-size: 13px; margin-top: 8px; }
#error { color: #DC2626; display: none; }
@media (prefers-color-scheme: dark) {
  body { background: #1e1e2e; color: #cdd6f4; }
  h2 { color: #cdd6f4; }
  #status { color: #a6adc8; }
  .spinner { border-color: #313244; border-top-color: #8B5CF6; }
}
</style>
</head>
<body>
<h2>RozeLynx Extension Converter</h2>
<div class="spinner" id="spinner"></div>
<p id="status">Fetching extension...</p>
<p id="error"></p>
<button id="close-btn" style="display:none;" onclick="window.close()">Close</button>
<script src="lib/jszip.min.js"></script>
<script src="lib/convert.js"></script>
<script src="converter.js"></script>
</body>
</html>
