  <ellipse cx="8" cy="6.5" rx="2" ry="1.2" fill="none" stroke="#2D2D44" stroke-width="0.5" transform="rotate(144, 8, 8)"/>
  <ellipse cx="8" cy="6.5" rx="2" ry="1.2" fill="none" stroke="#2D2D44" stroke-width="0.5" transform="rotate(216, 8, 8)" opacity="0.7"/>
  <ellipse cx="8" cy="6.5" rx="2" ry="1.2" fill="none" stroke="#2D2D44" stroke-width="0.5" transform="rotate(288, 8, 8)"/>
