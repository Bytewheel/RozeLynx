# rozelynx-distro-versions.conf - pinned upstream sources for
# scripts/firefox-librewolf/rozelynx-distro-build.sh.
#
# Every input the distro-agnostic build pulls from the network is pinned
# here.  Bump versions by editing this file (or overriding via env /
# --firefox/--librewolf-ref/--floorp-ref flags), never by chasing a
# moving branch.
#
# NOTE: the LibreWolf and Floorp checkouts are REFERENCE sources.
# The patches actually applied to the Firefox tree are the ones vendored
# in this overlay (scripts/firefox-librewolf/), which are rebased per
# Firefox version.  Floorp features are already ported into the RozeLynx
# extension + C++ code, so Floorp is never applied as a patch source.

# --- base browser ----------------------------------------------------------
FIREFOX_VERSION="156.0.1"
# Integrity pins (sha512, from the Gentoo Manifest; empty = fetch without check)
FIREFOX_SOURCE_SHA512="80a32a79268b672206f5477ca6bfde620cb7419b27aac090e01f06df06990ee0bbd81bb5c4aa78ac1d0edb26b133b1c6fa11cb6522445eccd70c82e719a24d5b"

# --- Gentoo firefox patchset (build fixes for system libs) -----------------
# Same patchset the ebuild applies (FIREFOX_PATCHSET in the template).
GENTOO_PATCHSET="firefox-156-patches-02.tar.xz"
GENTOO_PATCHSET_SHA512="6d4b61e0021c7a6af70f301ca1257641b4ffbb3e91f9a626d0fa7784cdd11d68f8f77ac723088608569490a363057f695a21101434de9d5f4fa3bacecc7cc6bf"
GENTOO_PATCHSET_BASE_URI="https://dev.gentoo.org/~juippis/mozilla/patchsets"

# --- LibreWolf (reference checkout; patches vendored in this overlay) ------
LIBREWOLF_REPO="https://gitlab.com/librewolf-community/browser/source.git"
# Upstream tags lag their own releases (they currently stop far behind
# current Firefox), so the pin is a commit SHA of upstream main.
# Re-pin when bumping:
#   git ls-remote https://gitlab.com/librewolf-community/browser/source.git HEAD
LIBREWOLF_REF="135b0253636a8db712e9a1aa8d09a8c3d8806213"

# --- Floorp (reference checkout only; features ported into rozelynx code) --
FLOORP_REPO="https://github.com/Floorp-Projects/Floorp.git"
FLOORP_REF="v12.20.0"

# --- packaging tools -------------------------------------------------------
# appimagetool release tag (github.com/AppImage/appimagetool/releases)
APPIMAGETOOL_TAG="1.9.1"
# Flatpak runtime pin for the generated org.bytewheel.rozelynx manifest
FLATPAK_RUNTIME="org.freedesktop.Platform"
FLATPAK_SDK="org.freedesktop.Sdk"
FLATPAK_RUNTIME_VERSION="24.08"
# Snap base for the generated meta/snap.yaml
SNAP_BASE="core22"